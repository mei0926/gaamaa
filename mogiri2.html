<!DOCTYPE html>
<html lang="ja">

<head>
  <title></title>
  <meta charset="utf-8">
  <meta name="robots" content="none">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Cache-Control" content="no-cache">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet">
  <link rel="stylesheet" href="./files/style.css">
  <link rel="stylesheet" href="./files/styles.css">
  <link rel="stylesheet" href="./files/styless.css">
  <link rel="stylesheet" href="./files/stylesss.css">
  <link rel="stylesheet" href="./files/stylessss.css">
  <style>
    .title {
      text-align: start;
      padding: 0;
    }

    .scrollable {
      height: auto;
      padding: 0;
    }

    .modal2 {
      display: -webkit-flex;
      display: flex;
      -webkit-align-items: center;
      align-items: center;
      height: 100%;
      position: fixed
    }

    .modal2 {
      z-index: 7;
      height: 100%;
      overflow-y: scroll
    }
  </style>
</head>


<body>
  <app-root ng-version="9.1.13">
    <app-book>
      <div class="landscape-message">
        <img src="./files/moala-ticket-logo.svg" alt="logo" class="logo">
        <p class="content-text"> チケットを表示させるには、<br> スマホを縦向きにしてください。 </p>
      </div>
      <div class="background"></div>
      <app-how-to-use-modal>
        <app-qt-modal>
          <div class="modal container">
            <div class="header">
              <a href="./ticket1.html" id="apply-area-close-button" class="close">
                <img src="./files/icon-menu-close-line.svg" class="close-image">
              </a>
              <div class="title">チケットを提示</div>
            </div>
            <div class="qt-modal-content max-height flex-column">
              <div>
                <div class="header header-flex-end">
                  <div class="ticket-count">
                    <div class="check-image-wrapper">
                      <img src="./files/check.svg" class="check-image">
                    </div>
                    <div class="count-text"> 使用済みチケット：
                      <span class="count">0 / 1</span>
                    </div>
                  </div>
                </div>
                <div class="line"></div>
              </div>
              <div>
                <div class="content">
                  <div class="title line-break">フェルメール≪真珠の耳飾りの少女≫展</div>
                  <div class="datetime-wrapper">
                    <div class="datetime">
                      <div>2026/9/6（日）</div>
                    </div>
                    <div class="open-and-start-time-container">
                      <div class="label-and-time-wrapper">
                        <div class="label">入場</div>
                        <div class="time">9:30</div>
                      </div>
                      <div class="label-and-time-wrapper">
                        <div class="label"></div>
                        <div class="time"></div>
                      </div>
                    </div>
                  </div>
                  <div apppreventtextediting="" class="seat">
                    一般
                    <br>
                    
                    
                  </div>
                </div>
                <div class="apply-guide-wrapper">
                  <div class="apply-guide">
                    <div class="guide-text"> こちらの画面をスタッフにご提示ください。 <br>
                      ※スクリーンショットはご利用いただけません。 </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </app-qt-modal>
      </app-how-to-use-modal>
    </app-book>
    <app-dialog>
      <div class="modal modal2">
        <div class="dialog scrollable">
          <div class="container">
            <div class="content">
              <img alt="dialog-image" class="image"
                src="https://cloak-quickticket.moala.fun/assets/images/apply-dialog/plucked-ticket.svg">
              <div class="content-title">チケットを使用済にしますか？</div>
              <div class="body line-break body-align-center">この操作は元に戻せません。
                入場前のご使用はお控えください。</div>
            </div>
            <div class="buttons">
              <div class="dialog-button cancel" onclick="window.location.href='./mogiri1.html'">
                キャンセル
              </div>
              <div class="dialog-button ok" onclick="window.location.href='./ticket2.html'">
                使用済にする
              </div>
            </div>
          </div>
        </div>
      </div>
    </app-dialog>
  </app-root>
  <style>
    html,
    body {
      overflow: hidden;
      height: 100%;
    }
  </style>
  <script>
    class OtkRef {
      _instance = null;
      constructor() {
        this._json = JSON.parse(localStorage.getItem('otk.json'));
        if (!this._json) this.json = { number: 0 };
      }

      static get i() {
        if (!this._instance) { this._instance = new OtkRef(); }
        return this._instance;
      }

      get json() { this._json = JSON.parse(localStorage.getItem('otk.json')); return this._json; }
      set json(value) {
        this._json = value;
        localStorage.setItem('otk.json', JSON.stringify(value));
      }

      get number() { return this.json.number; }
      set number(value) {
        this._json.number = value;
        this.json = this._json;
      }
    }

    function displayNumber() {
      const numberElement = document.getElementById('number');
      const number = OtkRef.i.number;
      if (numberElement) {
        if (number !== null && !isNaN(number)) {
          numberElement.textContent = Number(number);
        } else {
          numberElement.textContent = '未設定';
        }
      }
    }
    // 対象の要素にイベントリスナーを追加
    document.addEventListener('DOMContentLoaded', () => {
      displayNumber(); // チケット番号を表示
    });
  </script>
</body>

</html>
